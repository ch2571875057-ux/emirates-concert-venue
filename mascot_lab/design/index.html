<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋主题吉祥物 · 三视图设计稿总览</title>
<style>
  body { margin: 0; background: #eef1f6; font-family: 'Segoe UI','Microsoft YaHei',sans-serif; }
  header { padding: 18px 28px; }
  header h1 { margin: 0 0 6px; font-size: 22px; color: #2b3445; }
  header p { margin: 0; font-size: 14px; color: #5a6478; }
  main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; padding: 0 28px 28px; }
  figure { margin: 0; background: #fff; border: 1px solid #d5dbe6; border-radius: 10px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 14px; font-size: 14px; color: #2b3445; border-top: 1px solid #e5e9f0; }
  figcaption b { margin-right: 8px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>海洋主题吉祥物 · 三视图设计稿总览（阶段 0 审稿）</h1>
  <p>六尊 · 中号 2-3m（含基座 Ø1.8m × 0.55m）· 圆润卡通亮面 · GLOW_* 发光件 + 基座射灯 · 原生朝向 +x · ≤10k 面/尊 · 导出 GLB</p>
</header>
<main>
  <figure><img src="mascot_01_dolphin.png" alt="海豚"><figcaption><b>01 海豚 · 主唱</b>尾立举麦挥手 · 场外南广场主雕（迎宾）</figcaption></figure>
  <figure><img src="mascot_02_octopus.png" alt="章鱼"><figcaption><b>02 章鱼 · 鼓手</b>双腕举槌四腕搭座 · 场外东入口</figcaption></figure>
  <figure><img src="mascot_03_whale.png" alt="鲸鱼"><figcaption><b>03 鲸鱼 · 贝斯手</b>礼帽抱贝斯 · 场外西入口</figcaption></figure>
  <figure><img src="mascot_04_seahorse.png" alt="海马"><figcaption><b>04 海马 · 吉他手</b>S 身姿卷尾挂座 · 场外北入口</figcaption></figure>
  <figure><img src="mascot_05_starfish.png" alt="海星"><figcaption><b>05 海星 · 应援团长</b>双臂举蟹钳棒 · 场内地坪东南角</figcaption></figure>
  <figure><img src="mascot_06_jellyfish.png" alt="水母"><figcaption><b>06 水母 · 灯光师</b>悬浮发光伞盖提追光灯 · 场内地坪西南角</figcaption></figure>
</main>
</body>
</html>
