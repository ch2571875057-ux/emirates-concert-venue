  <rect x="165" y="720" width="52" height="40" rx="6" fill="#c9b0ff"/><text x="191" y="778" font-size="11" fill="#5a6478" text-anchor="middle">#c9b0ff</text><text x="191" y="792" font-size="11" fill="#5a6478" text-anchor="middle">内层</text>
