<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="1280" height="880" fill="#f5f7fa"/>
  <text x="60" y="46" font-size="26" font-weight="bold" fill="#2b3445">吉祥物 06 · 水母 — 灯光师</text>
  <text x="60" y="72" font-size="15" fill="#5a6478">海洋主题吉祥物雕塑 · 三视图设计稿（正面 / 侧面 / 俯视）</text>
  <text x="1220" y="46" font-size="13" fill="#5a6478" text-anchor="end">比例 1m ≙ 165px · 原生朝向 +x · 面数 ≤10k · 导出 GLB</text>
  <text x="1220" y="68" font-size="13" fill="#5a6478" text-anchor="end">设定：悬浮水母，伞盖呼吸发光，垂腕提小追光灯</text>

