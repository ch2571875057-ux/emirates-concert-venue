<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酋长球场 · 演唱会场馆</title>
<script>
/* 在线版资源基址
   Pages 出口实测只有 19–45 KB/s，首屏 7.5 MB 要三分钟以上，所以并行探测几个 CDN，
   用最快那个；都不通就同源回退（慢但还能开）。本机 127.0.0.1 / localhost 直接同源，
   保持零依赖、断网可跑。
   开关：?cdn=off 强制同源 · ?cdn=1 本地也走 CDN · ?cdn=<url> 指定镜像 · ?diag=1 显示探测详情 */
(function () {
  var OWNER = 'ch2571875057-ux';
  var REPO = 'emirates-concert-venue';
  var CANDIDATES = [
    { id: 'fastly', url: 'https://fastly.jsdelivr.net/gh/' + OWNER + '/' + REPO + '@main/' },
    { id: 'jsdelivr', url: 'https://cdn.jsdelivr.net/gh/' + OWNER + '/' + REPO + '@main/' },
    { id: 'onms', url: 'https://jsd.onmicrosoft.cn/gh/' + OWNER + '/' + REPO + '@main/' },
    { id: 'jsdmirror', url: 'https://cdn.jsdmirror.com/gh/' + OWNER + '/' + REPO + '@main/' }
  ];
  // 探测文件不能太小：2 KB 在任何节点都在 400 ms 内返回，量不出真实吞吐。
  // 实测 cdn.jsdmirror.com 拉 2 KB 是 396 ms（看着最快），拉 Arsenal.glb 只有 7 KB/s，
  // 首屏 7.5 MB 就是几分钟。用 64 KB 的 crowd_a.glb 才能把「联通」和「够快」分开。
  var PROBE = 'assets/crowd_a.glb';
  // 四个节点并行探测，等全部回来才挑（要按优先级挑，不能谁先回就用谁）。
  // 所以这里的超时就是首屏额外等待的上限，不能开太大。
  var PROBE_MS = 2500;
  // 门槛定得低：64 KB 的探测里 TLS 握手占了一半时间，
  // 实测就算 3.4 MB/s 的节点也只测出 125 KB/s。这里只用来排除真坏的，
  // 不能当成真实带宽——否则网速慢的机器会被误判成导致回退。
  var MIN_KBS = 20;
  var HARD_MS = 3000;    // 硬兜底必须长于 PROBE_MS，否则探测还没回来就被判失败
  var V_CSS = 'styles.css?v=6';
  var V_APP = 'js/app.js?v=30';

  var q = new URLSearchParams(location.search);
  var opt = q.get('cdn');
  var host = location.hostname;
  // file:// 打开时 hostname 是空串，但它并不是「本机服务器」——那种情况必须走 CDN，否则相对路径全废
  var isFile = location.protocol === 'file:';
  var isLocal = !isFile && (host === '127.0.0.1' || host === 'localhost' || host === '0.0.0.0' || host === '');
  var diag = q.get('diag') === '1';

  window.__net = { source: null, base: null, probes: [], note: '' };
  var probes = window.__net.probes;

  function supportsImportMap() {
    return !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  }

  // importmap 是静态解析的：<base> 改了相对路径也救不了它，必须按最终基址动态生成。
  function mount(base) {
    base = base || location.origin + location.pathname.replace(/[^/]*$/, '');
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({
      imports: {
        'three': base + 'vendor/three.module.js',
        'three/addons/': base + 'vendor/jsm/'
      }
    });
    document.head.appendChild(im);

    // <link>/<script src> 走 HTML 预扫描会按同源地址预取，那时 base 还没插入，必须动态创建。
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = V_CSS;
    document.head.appendChild(css);
    var app = document.createElement('script');
    app.type = 'module';
    app.src = V_APP;
    document.head.appendChild(app);
  }

  function useBase(url, label) {
    var b = document.createElement('base');
    b.href = url;
    document.head.appendChild(b);
    window.__assetBase = document.baseURI;
    window.__assetSource = label;
    window.__net.source = label;
    window.__net.base = url;
    mount(url);
    // 探测是异步的，DOMContentLoaded 可能已经过去了，这里补一次标签刷新
    var src = document.getElementById('loading-src');
    if (src) src.textContent = label;
    if (diag) {
      var sub = document.querySelector('.loading-sub');
      if (sub) sub.textContent = probes.length
        ? probes.map(function (r) { return r.id + ' ' + (r.ok ? r.ms + 'ms/' + r.kbs + 'KB/s' : r.why); }).join(' · ')
        : label;
    }
  }

  function probeOne(c) {
    return new Promise(function (resolve) {
      var ctl = typeof AbortController === 'function' ? new AbortController() : null;
      var t0 = performance.now();
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        if (ctl) { try { ctl.abort(); } catch (e) {} }
        resolve({ id: c.id, ok: false, ms: PROBE_MS, why: '超时' });
      }, PROBE_MS);
      // 必须把 body 读完。fetch 的 Promise 在响应头到达时就 resolve，
      // 那只是 TTFB，不代表吞吐量——之前就是这样把 7 KB/s 的节点选成了最优。
      fetch(c.url + PROBE, { mode: 'cors', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer().then(function (buf) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            var ms = performance.now() - t0;
            var kbs = buf.byteLength / 1024 / (ms / 1000);
            // 门槛：低于 MIN_KBS 就算通也不用（首屏约 7.5 MB，60 KB/s 要两分钟）
            if (kbs < MIN_KBS) {
              resolve({ id: c.id, ok: false, ms: Math.round(ms), kbs: Math.round(kbs), why: '太慢 ' + Math.round(kbs) + 'KB/s' });
              return;
            }
            resolve({ id: c.id, ok: true, ms: Math.round(ms), kbs: Math.round(kbs), why: 'ok' });
          });
        })
        .catch(function (e) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve({ id: c.id, ok: false, ms: Math.round(performance.now() - t0), why: (e && e.name) || '连接失败' });
        });
    });
  }

  // 本机 / 显式同源：不探测
  if (!opt && isLocal) {
    window.__assetBase = location.href;
    window.__assetSource = '本站（本地）';
    window.__net.source = '本站（本地）';
    mount(location.origin + location.pathname.replace(/[^/]*$/, ''));
  } else if (opt === 'off') {
    window.__assetBase = location.origin + '/';
    window.__assetSource = '本站（同源）';
    window.__net.source = '本站（同源）';
    mount(location.origin + '/');
  } else if (opt && opt !== '1') {
    var u = opt.charAt(opt.length - 1) === '/' ? opt : opt + '/';
    useBase(u, '自定义 ' + u.replace(/^https?:\/\//, '').split('/')[0]);
  } else {
    // ?cdn=1 也走全量探测（用户分不清 fastly / jsdelivr，给最快的就对）；
    // 想固定到某个镜像就用 ?cdn=<url>
    var list = CANDIDATES;
    var settled = false, done = 0;

    function finish(force) {
      if (settled) return;
      settled = true;
      // 按固定优先级选，不按测出来的速度选。
      // 原因：64 KB 的探测里 TLS 握手占一半时间，测出来的数字漂得厉害
      // （同一节点连续两次：36 KB/s 和 2183 KB/s），按它排序会选到实际很慢的节点。
      // 固定优先级反而稳：fastly 在几十次测里几乎一直是最快的。
      var ok = probes.filter(function (r) { return r.ok; });
      ok.sort(function (a, b) {
        var ia = -1, ib = -1;
        for (var j = 0; j < list.length; j++) {
          if (list[j].id === a.id) ia = j;
          if (list[j].id === b.id) ib = j;
        }
        return ia - ib;
      });
      if (!ok.length) {
        window.__net.note = '所有 CDN 都不可达，已回退同源（GitHub Pages 出口被限速，可能要等几分钟）';
        useBase(location.origin + '/', '本站回退');
        return;
      }
      var best = ok[0], hit = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === best.id) hit = list[i];
      useBase(hit.url, hit.id + ' · ' + best.ms + 'ms · ' + best.kbs + 'KB/s');
    }

    // 不能「谁先回来就用谁」——那样选的是延迟最低的，
    // 而不是优先级最高的。等全部探测结束（或硬兜底到时）再统一挑。
    setTimeout(function () { finish(false); }, HARD_MS);
    list.forEach(function (c) {
      probeOne(c).then(function (r) {
        probes.push(r);
        done++;
        if (!settled && done === list.length) finish(false);
      });
    });
  }

  // ---- 加载层诊断：出问题时把原因直接写在屏幕上，别让人对着黑屏猜 ----
  function overlay(lines) {
    var err = document.getElementById('loading-error');
    if (err) err.textContent = lines.join('\n');
    var sub = document.querySelector('.loading-sub');
    if (sub) sub.textContent = '打不开？看下面的说明';
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('loading-src');
    if (src && window.__net.source) src.textContent = window.__net.source;

    if (!supportsImportMap()) {
      overlay([
        '[浏览器不支持 import map]',
        '请用 Chrome / Edge 89+ 或 Safari 16.4+ 打开；',
        'Windows 自带的旧版 IE / 360 兼容模式、QQ 浏览器兼容内核都不行。',
        '也可以直接双击项目里的「启动服务器.bat」在本机看，不依赖浏览器版本之外的任何东西。'
      ]);
      return;
    }

    if (diag) {
      var sub = document.querySelector('.loading-sub');
      if (sub) {
        sub.textContent = probes.length
          ? probes.map(function (r) { return r.id + ' ' + (r.ok ? r.ms + 'ms/' + r.kbs + 'KB/s' : r.why); }).join(' · ')
          : (window.__net.source || '');
      }
      return;
    }

    setTimeout(function () {
      var l = document.getElementById('loading');
      if (l && l.classList.contains('done')) return;
      var lines = ['加载超过 25 秒还没完成。'];
      if (window.__net.note) lines.push(window.__net.note);
      if (probes.length) {
        lines.push('节点探测：' + probes.map(function (r) { return r.id + ' ' + (r.ok ? r.ms + 'ms/' + r.kbs + 'KB/s' : r.why); }).join(' / '));
      }
      lines.push('可以试：① 换手机热点或别的网络再打开；');
      lines.push('② 地址后面加 ?cdn=off 强制同源（慢但一定能跑）；');
      lines.push('③ 在本机双击「启动服务器.bat」，用 127.0.0.1:8141 看。');
      overlay(lines);
    }, 25000);
  });
})();
</script>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="loading-card">
    <div class="loading-title">酋长球场 · 演唱会场馆</div>
    <div class="loading-sub">正在载入球场模型…</div>
    <div id="loading-src"></div>
    <div class="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-pct">0%</div>
    <div id="loading-error"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <aside id="sidebar">
    <div class="sb-head">
      <button id="sb-toggle" class="sb-icon-btn" title="收起/展开面板">⟨</button>
      <div class="sb-title">
        <span class="sb-name">酋长球场</span>
        <span class="sb-sub">演唱会场馆</span>
      </div>
    </div>
    <div class="sb-rail" id="sb-rail"></div>
    <div class="sb-body" id="hud-groups"></div>
    <div class="sb-status" id="sb-status"></div>
  </aside>

  <aside id="playlist">
    <div class="pl-head">
      <div class="pl-title">
        <span class="pl-name" id="pl-name">歌单</span>
        <span class="pl-sub" id="pl-sub"></span>
      </div>
      <button id="pl-toggle" class="sb-icon-btn" title="收起/展开歌单">⟩</button>
    </div>
    <ol class="pl-list" id="pl-list"></ol>
    <div class="pl-foot" id="pl-foot"></div>
  </aside>

  <div id="caption"></div>
  <div id="toast-box"></div>
</div>

<div id="debug-info" class="hidden"></div>

<script>
// QA：把模块加载/运行错误写到加载层，避免静默黑屏
(function () {
  function report(msg) {
    var el = document.getElementById('loading-error');
    if (el) el.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) {
    var st = e.error && e.error.stack ? e.error.stack.split('\n').slice(1, 4).join(' | ') : '';
    report('[error] ' + (e.message || e.error) + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ' :: ' + st);
  });
  window.addEventListener('unhandledrejection', function (e) {
    report('[promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>


<script>
// 收起/展开按钮：内联绑定，模型加载前即可用（不依赖 app.js）
window.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('sb-toggle');
  btn.onclick = function () {
    var collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
    btn.textContent = collapsed ? '⟩' : '⟨';
  };
  var plBtn = document.getElementById('pl-toggle');
  plBtn.onclick = function () {
    var collapsed = document.getElementById('playlist').classList.toggle('collapsed');
    plBtn.textContent = collapsed ? '⟨' : '⟩';
  };
});
</script>
</body>
</html>
